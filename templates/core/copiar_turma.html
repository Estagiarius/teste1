{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-lg shadow-md p-8 mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center">Copiar Turma</h2>
    <p class="mb-4 text-gray-600 text-center">Origem: <strong>{{ turma.nome }} ({{ turma.ano_letivo }})</strong></p>

    <div class="bg-blue-50 border-l-4 border-blue-400 p-4 mb-6">
        <p class="text-sm text-blue-700">
            A cópia de turma irá replicar a estrutura completa (Disciplinas e Avaliações). Os alunos não serão copiados, pois eles mudam a cada ano.
        </p>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700">Nome da Nova Turma</label>
            <input type="text" name="novo_nome" value="{{ turma.nome }} - Cópia" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Ano Letivo</label>
            <input type="number" name="novo_ano" value="{% now 'Y' %}" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div class="flex gap-2">
            <button type="button" onclick="history.back()" class="w-1/2 flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                Cancelar
            </button>
            <button type="submit" class="w-1/2 flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                Copiar
            </button>
        </div>
    </form>
</div>
{% endblock %}
