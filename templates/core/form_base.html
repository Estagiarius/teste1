{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-8 mt-10 mb-20">
    <h2 class="text-2xl font-bold mb-6 text-center">Formulário</h2>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="flex justify-end gap-2 mt-6">
            <button type="button" onclick="history.back()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">Cancelar</button>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Salvar</button>
        </div>
    </form>
</div>
{% endblock %}
