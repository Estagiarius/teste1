{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-lg shadow-md p-8 mt-10">
    <h2 class="text-2xl font-bold mb-6 text-center">Importar Alunos via CSV</h2>
    <p class="mb-4 text-gray-600">Turma: <strong>{{ turma.nome }}</strong></p>

    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
        <p class="text-sm text-yellow-700">
            O arquivo CSV deve conter as colunas "Nome do Aluno" e "Data de Nascimento". O sistema pulará cabeçalhos automaticamente.
        </p>
    </div>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700">Arquivo CSV</label>
            <input type="file" name="csv_file" accept=".csv" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            Importar
        </button>
    </form>
</div>
{% endblock %}
